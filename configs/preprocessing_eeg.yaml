# EEG Preprocessing Configuration

dataset_name: eeg_mat
subjects: "all"
data_root: "data-eeg/EEG Audio Dataset Preprocessing"
dataset_style: "audio_preproc_mat"
drop_aux_channels: true
require_word_labels: true
trial_label_path: null
event_label_map: null

# Dataset location (.mat flat layout or BIDS sub-* layout)
data_root: "EEG"

l_freq: 0.1
h_freq: 40.0
notch_freqs: [50.0]

epoch_tmin: -0.1
epoch_tmax: 0.6
baseline: [-0.1, 0.0]

target_sfreq: 256.0
n_ica_components: 20
reject_threshold: null

# .mat-specific: trigger codes to use as stimulus onsets (null = all events)
stimulus_codes: null
# Optional code→label mapping, e.g. {131: "left", 132: "right"}
event_code_labels: {}

output_dir: "data/processed"
